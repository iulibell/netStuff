
[V200R003C00]
#
 sysname ISP2
#
 snmp-agent local-engineid 800007DB03000000000000
 snmp-agent
#
 clock timezone China-Standard-Time minus 08:00:00
#
portal local-server load portalpage.zip
#
 drop illegal-mac alarm
#
 undo info-center enable
#
 set cpu-usage threshold 80 restore 75
#
aaa
 authentication-scheme default
 authorization-scheme default
 accounting-scheme default
 domain default
 domain default_admin
 local-user admin password cipher %$%$K8m.Nt84DZ}e#<0`8bmE3Uw}%$%$
 local-user admin service-type http
#
firewall zone Local
 priority 15
#
ip vpn-instance enterprise
 ipv4-family
  route-distinguisher 100:2
  vpn-target 100:1 export-extcommunity
  vpn-target 100:1 import-extcommunity
#
mpls lsr-id 192.168.255.12
mpls
mpls ldp
#
interface GigabitEthernet0/0/0
 ip address 200.147.112.2 255.255.255.0
 mpls
 mpls ldp
#
interface GigabitEthernet0/0/1
 ip address 200.147.22.1 255.255.255.0
 mpls
 mpls ldp
#
interface GigabitEthernet0/0/2
 ip address 192.168.254.2 255.255.255.0
#
interface LoopBack0
 ip address 192.168.255.12 255.255.255.255
#
interface NULL0
#
ospf 100 router-id 192.168.255.12
 area 0.0.0.0
  network 192.168.255.12 0.0.0.255
  network 200.147.112.0 0.0.0.255
  network 200.147.22.0 0.0.0.255
  network 192.168.254.0 0.0.0.255
#
bgp 65000
 peer 192.168.255.1 as-number 65000
 peer 192.168.255.1 connect-interface LoopBack0
 peer 192.168.255.2 as-number 65000
 peer 192.168.255.2 connect-interface LoopBack0
 #
 ipv4-family vpnv4
  policy vpn-target
  peer 192.168.255.1 enable
  peer 192.168.255.2 enable
 #
 ipv4-family vpn-instance enterprise
  import-route direct
  import-route static
#
user-interface con 0
 authentication-mode password
user-interface vty 0 4
user-interface vty 16 20
#
wlan ac
#
return
