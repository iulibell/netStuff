
[V200R003C00]
#
 sysname BACKBONE1
#
 snmp-agent local-engineid 800007DB03000000000000
 snmp-agent
#
 clock timezone China-Standard-Time minus 08:00:00
#
portal local-server load portalpage.zip
#
 drop illegal-mac alarm
#
 undo info-center enable
#
 set cpu-usage threshold 80 restore 75
#
aaa
 authentication-scheme default
 authorization-scheme default
 accounting-scheme default
 domain default
 domain default_admin
 local-user admin password cipher %$%$K8m.Nt84DZ}e#<0`8bmE3Uw}%$%$
 local-user admin service-type http
#
firewall zone Local
 priority 15
#
mpls lsr-id 192.168.255.1
mpls
mpls ldp
#
interface GigabitEthernet0/0/0
 ip address 200.147.1.1 255.255.255.0
 mpls
 mpls ldp
#
interface GigabitEthernet0/0/1
 ip address 200.147.4.2 255.255.255.0
 mpls
 mpls ldp
#
interface GigabitEthernet0/0/2
 ip address 200.147.11.2 255.255.255.0
 mpls
 mpls ldp
#
interface LoopBack0
 ip address 192.168.255.1 255.255.255.255
#
interface NULL0
#
ospf 100 router-id 192.168.255.1
 area 0.0.0.0
  network 192.168.255.1 0.0.0.255
  network 200.147.1.0 0.0.0.255
  network 200.147.4.0 0.0.0.255
  network 200.147.11.0 0.0.0.255
#
bgp 65000
 peer 192.168.255.11 as-number 65000
 peer 192.168.255.11 connect-interface LoopBack0
 peer 192.168.255.12 as-number 65000
 peer 192.168.255.12 connect-interface LoopBack0
 peer 192.168.255.13 as-number 65000
 peer 192.168.255.13 connect-interface LoopBack0
 peer 192.168.255.14 as-number 65000
 peer 192.168.255.14 connect-interface LoopBack0
 #
 ipv4-family vpnv4
  undo policy vpn-target
  peer 192.168.255.11 enable
  peer 192.168.255.11 reflect-client
  peer 192.168.255.12 enable
  peer 192.168.255.12 reflect-client
  peer 192.168.255.13 enable
  peer 192.168.255.13 reflect-client
  peer 192.168.255.14 enable
  peer 192.168.255.14 reflect-client
#
user-interface con 0
 authentication-mode password
user-interface vty 0 4
user-interface vty 16 20
#
wlan ac
#
return
