# eNSP 云端栈：Prometheus(存储) + Grafana(展示)
# 数据来源：本机 SSH 反向隧道 (-R 9116/9117)
# 启动：docker compose up -d
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ensp-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    # 隧道只绑在宿主机 127.0.0.1，必须用 host 网络才能抓到 localhost:9116/9117
    # host 网络下无需 ports 映射，Prometheus 直接监听宿主机 9090
    network_mode: host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ensp-grafana
    # 与 Prometheus 同处 host 网络，数据源直接写 localhost:9090，无网关绕转
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # host 网络下 ports 无效，Grafana 直接监听宿主机 3000
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
