# eNSP 企业网 Prometheus 配置
# 抓取策略（企业分层实践）：
#   ensp-core   核心/骨干/防火墙/关键服务  30s 轮询
#   ensp-agg    汇聚/出口交换机            60s 轮询
#   ensp-access 接入层交换机              120s 轮询（接入层以 Trap 为主）
#   ensp-traps  Trap 接收器自身指标        30s
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    project: ensp-enterprise-topo

scrape_configs:
  # ---------- 核心层：骨干路由器 / 防火墙 / 核心交换 / AC / DHCP ----------
  - job_name: ensp-core
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets: ['ensp-exporter:9116']
        labels:
          tier: core
    metrics_path: /probe
    params:
      tier: ['core']

  # ---------- 汇聚层：AGG / 出口 / 服务器区交换机 ----------
  - job_name: ensp-agg
    scrape_interval: 60s
    scrape_timeout: 25s
    static_configs:
      - targets: ['ensp-exporter:9116']
        labels:
          tier: agg
    metrics_path: /probe
    params:
      tier: ['agg']

  # ---------- 接入层：ACC / 分部接入 / 用户接入（低频轮询 + Trap 为主）----------
  - job_name: ensp-access
    scrape_interval: 120s
    scrape_timeout: 30s
    static_configs:
      - targets: ['ensp-exporter:9116']
        labels:
          tier: access
    metrics_path: /probe
    params:
      tier: ['access']

  # ---------- Trap 接收器（SNMP Trap → Prometheus 指标）----------
  - job_name: ensp-traps
    scrape_interval: 30s
    static_configs:
      - targets: ['ensp-trap-receiver:9117']
